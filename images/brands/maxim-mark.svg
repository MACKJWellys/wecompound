<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Maxim Motors">
  <title>Maxim Motors</title>
  <!-- Compact square mark: red ground, white "M" monogram, red car-sweep cutting across. -->
  <rect width="100" height="100" fill="#e11c1c"/>

  <!-- M monogram, slanted ~8deg, white -->
  <g transform="translate(22,26) skewX(-8)">
    <path fill="#ffffff" d="M0,48 V0 H12 L28,30 L44,0 H56 V48 H43 V20 L31,42 H25 L13,20 V48 Z"/>
  </g>

  <!-- car-silhouette sweep across the lower third, darker red for depth -->
  <path fill="#15181c" d="M12,74
    C26,74 31,66 44,61
    C57,56 67,56 82,57
    C86,57 89,59 91,62
    L91,68
    C88,65 85,64 81,64
    C67,63 58,63 46,68
    C32,74 27,82 12,82 Z"/>
</svg>
